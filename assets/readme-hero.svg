<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Srujan Mirji — Full-Stack Developer and AI Product Builder</title>
  <desc id="desc">A futuristic dark 3D developer command center with neon cyan and violet light, a holographic code core, and perspective grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03040b"/>
      <stop offset="0.46" stop-color="#080d20"/>
      <stop offset="1" stop-color="#040611"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#7c5cff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff36d1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#dffcff"/>
      <stop offset="1" stop-color="#a8b4ff"/>
    </linearGradient>
    <linearGradient id="cyanFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#087ea4" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="violetFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a879ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a178a" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="cyanAura">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAura">
      <stop offset="0" stop-color="#8a5cff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8ca2ff" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#00f5ff" flood-opacity="0.9"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feFlood flood-color="#8a5cff" flood-opacity="0.75"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <clipPath id="frameClip"><rect x="4" y="4" width="1192" height="512" rx="29"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="4" y="4" width="1192" height="512" rx="29" fill="url(#bg)"/>
    <rect x="4" y="4" width="1192" height="512" rx="29" fill="url(#microgrid)"/>

    <circle cx="1000" cy="174" r="290" fill="url(#cyanAura)">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="728" cy="500" r="360" fill="url(#violetAura)">
      <animate attributeName="opacity" values="0.85;0.45;0.85" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- orbital dust -->
    <g fill="#dffcff">
      <circle cx="109" cy="77" r="1.4" opacity="0.7"/>
      <circle cx="236" cy="51" r="1" opacity="0.45"/>
      <circle cx="518" cy="87" r="1.3" opacity="0.55"/>
      <circle cx="683" cy="55" r="1.2" opacity="0.65"/>
      <circle cx="793" cy="107" r="1" opacity="0.42"/>
      <circle cx="1128" cy="73" r="1.4" opacity="0.7"/>
      <circle cx="1141" cy="301" r="1" opacity="0.55"/>
      <circle cx="747" cy="252" r="1.2" opacity="0.48"/>
    </g>

    <!-- horizon and perspective floor -->
    <path d="M0 356H1200" stroke="#00f5ff" stroke-opacity="0.22"/>
    <g fill="none" stroke="#7667ff" stroke-opacity="0.25" stroke-width="1">
      <path d="M590 356L-80 520"/><path d="M590 356L95 520"/><path d="M590 356L270 520"/>
      <path d="M590 356L445 520"/><path d="M590 356L620 520"/><path d="M590 356L795 520"/>
      <path d="M590 356L970 520"/><path d="M590 356L1145 520"/><path d="M590 356L1320 520"/>
      <path d="M0 384H1200"/><path d="M0 418H1200"/><path d="M0 460H1200"/><path d="M0 510H1200"/>
    </g>

    <!-- system eyebrow -->
    <g font-family="Arial, Helvetica, sans-serif" letter-spacing="2.4">
      <circle cx="69" cy="74" r="5" fill="#00ffb2" filter="url(#glowCyan)">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="80" fill="#85fff2" font-size="14" font-weight="700">SYSTEM ONLINE</text>
      <text x="265" y="80" fill="#73809f" font-size="12">// PROFILE.OS 2026</text>
    </g>

    <!-- extruded display name -->
    <g font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="78" letter-spacing="2">
      <text x="63" y="193" fill="#2b176b" opacity="0.38">SRUJAN</text>
      <text x="61" y="191" fill="#39208e" opacity="0.48">SRUJAN</text>
      <text x="59" y="189" fill="#5135bb" opacity="0.58">SRUJAN</text>
      <text x="57" y="187" fill="url(#titleFill)">SRUJAN</text>
      <text x="62" y="270" fill="#041c2c" opacity="0.5">MIRJI</text>
      <text x="60" y="268" fill="#064c66" opacity="0.62">MIRJI</text>
      <text x="58" y="266" fill="#0ba8be" opacity="0.7">MIRJI</text>
      <text x="56" y="264" fill="url(#titleFill)">MIRJI</text>
    </g>

    <text x="61" y="305" fill="#a9b8d6" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="600" letter-spacing="3.2">FULL-STACK DEVELOPER  •  AI PRODUCT BUILDER</text>

    <!-- terminal glass card -->
    <g filter="url(#softShadow)">
      <rect x="57" y="337" width="588" height="104" rx="14" fill="#0b1222" fill-opacity="0.82" stroke="#7084b7" stroke-opacity="0.35"/>
      <rect x="57" y="337" width="588" height="28" rx="14" fill="#111a31"/>
      <path d="M57 365H645" stroke="#7084b7" stroke-opacity="0.25"/>
      <circle cx="77" cy="351" r="4" fill="#ff5f57"/><circle cx="92" cy="351" r="4" fill="#febc2e"/><circle cx="107" cy="351" r="4" fill="#28c840"/>
      <text x="542" y="355" fill="#566584" font-size="10" font-family="monospace">srujan@build-lab</text>
      <text x="77" y="389" fill="#00f5ff" font-size="14" font-family="monospace">$</text>
      <text x="96" y="389" fill="#d8e5ff" font-size="14" font-family="monospace">ship --idea ambitious --quality obsessive</text>
      <text x="77" y="416" fill="#7f8ca8" font-size="13" font-family="monospace">→ code × product × motion × intelligence</text>
      <rect x="417" y="404" width="8" height="14" rx="1" fill="#00f5ff">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- holographic 3D code core -->
    <g transform="translate(956 228)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="178" ry="66" fill="none" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="2" transform="rotate(-12)" filter="url(#glowCyan)">
        <animateTransform attributeName="transform" type="rotate" from="-12" to="348" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="0" rx="142" ry="51" fill="none" stroke="#a879ff" stroke-opacity="0.55" stroke-width="1.5" transform="rotate(58)" filter="url(#glowViolet)">
        <animateTransform attributeName="transform" type="rotate" from="58" to="-302" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="0" cy="0" r="116" fill="url(#violetAura)" opacity="0.75"/>

      <!-- isometric cube -->
      <polygon points="0,-105 93,-52 0,2 -93,-52" fill="url(#cyanFace)" stroke="#79fbff" stroke-opacity="0.9"/>
      <polygon points="-93,-52 0,2 0,112 -93,57" fill="#081a36" fill-opacity="0.82" stroke="#775fff" stroke-opacity="0.75"/>
      <polygon points="93,-52 0,2 0,112 93,57" fill="url(#violetFace)" stroke="#ff70de" stroke-opacity="0.74"/>
      <path d="M0-105V2M-93-52L0 2 93-52M0 2V112" fill="none" stroke="#d9ffff" stroke-opacity="0.62"/>

      <g transform="skewY(29) translate(-58 -32)">
        <rect x="0" y="0" width="78" height="70" rx="7" fill="#07101f" fill-opacity="0.78" stroke="#00f5ff" stroke-opacity="0.65"/>
        <text x="39" y="44" text-anchor="middle" fill="#e9ffff" font-family="monospace" font-weight="700" font-size="24">&lt;/&gt;</text>
      </g>
      <path d="M-83 30L83-66" stroke="#ffffff" stroke-opacity="0.82" stroke-width="2" filter="url(#glowCyan)">
        <animate attributeName="d" values="M-83 30L83-66;M-83 82L83-14;M-83 30L83-66" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- telemetry labels -->
    <g font-family="monospace" font-size="11" letter-spacing="1.1">
      <path d="M778 122H868L890 143" fill="none" stroke="#00f5ff" stroke-opacity="0.5"/>
      <text x="778" y="113" fill="#76ecf3">CORE://CREATIVE</text>
      <path d="M1035 349H1134" fill="none" stroke="#ff61d5" stroke-opacity="0.48"/>
      <text x="1036" y="370" fill="#d89aff">DEPLOY://REALITY</text>
    </g>

    <!-- floating skill chips -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      <g transform="translate(727 408)"><rect width="102" height="31" rx="15.5" fill="#07141e" stroke="#00e9ff" stroke-opacity="0.55"/><text x="51" y="20" text-anchor="middle" fill="#aafaff">JAVA + SPRING</text></g>
      <g transform="translate(840 428)"><rect width="94" height="31" rx="15.5" fill="#100d25" stroke="#8569ff" stroke-opacity="0.6"/><text x="47" y="20" text-anchor="middle" fill="#c8bdff">REACT + TS</text></g>
      <g transform="translate(947 415)"><rect width="88" height="31" rx="15.5" fill="#150b21" stroke="#ff5fd7" stroke-opacity="0.58"/><text x="44" y="20" text-anchor="middle" fill="#ffc0ed">AI SYSTEMS</text></g>
      <g transform="translate(1047 393)"><rect width="74" height="31" rx="15.5" fill="#07141e" stroke="#00e9ff" stroke-opacity="0.55"/><text x="37" y="20" text-anchor="middle" fill="#aafaff">3D WEB</text></g>
    </g>
  </g>

  <rect x="4" y="4" width="1192" height="512" rx="29" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <path d="M34 5H1166" stroke="#fff" stroke-opacity="0.22"/>
</svg>
