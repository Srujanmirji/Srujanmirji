  <path d="M 76.0 468.7 L 96.8 467.7 L 117.6 461.9 L 138.4 462.9 L 159.1 455.2 L 179.9 461.9 L 200.7 464.8 L 221.5 453.3 L 242.3 455.2 L 263.1 461.9 L 283.8 473.5 L 304.6 463.8 L 325.4 455.2 L 346.2 455.2 L 367.0 462.9 L 387.8 420.6 L 408.5 448.5 L 429.3 458.1 L 450.1 456.2 L 470.9 468.7 L 491.7 461.9 L 512.5 456.2 L 533.3 467.7 L 554.0 463.8 L 574.8 462.9 L 595.6 467.7 L 616.4 465.8 L 637.2 451.3 L 658.0 479.2 L 678.7 485.0 L 699.5 485.0 L 720.3 485.0 L 741.1 482.1 L 761.9 473.5 L 782.7 467.7 L 803.5 483.1 L 824.2 485.0 L 845.0 485.0 L 865.8 479.2 L 886.6 443.7 L 907.4 463.8 L 928.2 455.2 L 948.9 436.9 L 969.7 468.7 L 990.5 477.3 L 1011.3 404.2 L 1032.1 459.0 L 1052.9 453.3 L 1073.6 457.1 L 1094.4 335.0 L 1115.2 440.8 L 1136.0 484.0" fill="none" stroke="url(#waveLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
